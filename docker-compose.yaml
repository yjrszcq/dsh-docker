services:
  deepseek-harness:
    image: dsh-docker:test
    container_name: dsh-test
    restart: unless-stopped
    ports:
      - "${DSH_LISTEN_ADDRESS:-0.0.0.0}:${DSH_PORT:-3000}:3080"
    group_add:
      - "dsh-sudo-${DSH_SUDO_ENABLED:-true}"
    environment:
      DSH_PLATFORM_DATA: /data/platform
      DSH_HOME: /data/dsh
      DSH_DEFAULT_WORKSPACE: "${DSH_DEFAULT_WORKSPACE:-/workspace}"
      DSH_PROXY_USERNAME: "${DSH_PROXY_USERNAME:-}"
      DSH_PROXY_PASSWORD: "${DSH_PROXY_PASSWORD:-}"
      DSH_PLATFORM_PASSWORD: "${DSH_PLATFORM_PASSWORD:-}"
      DSH_PLATFORM_PASSWORD_FILE: "${DSH_PLATFORM_PASSWORD_FILE:-}"
      DSH_PROXY_POLYFILL: "${DSH_PROXY_POLYFILL:-true}"
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-true}"
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
      DSH_LOG_MAX_BYTES: "${DSH_LOG_MAX_BYTES:-104857600}"
      DSH_LOG_RETENTION_DAYS: "${DSH_LOG_RETENTION_DAYS:-14}"
      DSH_ACTIVATION_TIMEOUT_SECONDS: "${DSH_ACTIVATION_TIMEOUT_SECONDS:-60}"
      DSH_EXPERIMENTAL_PROBATION_SECONDS: "${DSH_EXPERIMENTAL_PROBATION_SECONDS:-120}"
    volumes:
      - ./data/dsh:/data/dsh
      - ./data/platform:/data/platform
      - ./workspace:/workspace
