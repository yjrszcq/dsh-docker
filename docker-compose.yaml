services:
  deepseek-harness:
    image: szcq/deepseek-harness:${DSH_IMAGE_TAG:-latest}
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "${DSH_LISTEN_ADDRESS:-127.0.0.1}:${DSH_PORT:-3080}:3080"
    group_add:
      - "dsh-sudo-${DSH_SUDO_ENABLED:-false}"
    environment:
      DSH_HOME: /home/node/.dsh
      DSH_DEFAULT_WORKSPACE: "${DSH_DEFAULT_WORKSPACE:-/workspace}"
      DSH_PROXY_PASSWORD: "${DSH_PROXY_PASSWORD:-}"
      DSH_PROXY_USERNAME: "${DSH_PROXY_USERNAME:-}"
      DSH_PROXY_POLYFILL: "${DSH_PROXY_POLYFILL:-true}"
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-true}"
      DSH_TRUSTED_HOST: "${DSH_TRUSTED_HOST:-}"
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
    volumes:
      - dsh-data:/home/node/.dsh
      - ${DSH_WORKSPACE:-./workspace}:/workspace

volumes:
  dsh-data:
