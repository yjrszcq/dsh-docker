name: Publish Docker Image

on:
  workflow_dispatch:

env:
  IMAGE_OWNER: szcq
  IMAGE_NAME: deepseek-harness

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-image
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Management runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --prefix container/control-plane/services/management

      - name: Verify gateway and Compose configuration
        run: |
          npm test --prefix container/control-plane/services/gateway
          npm test --prefix container/platform
          node container/test/compose-config.mjs
          sh -n container/test/container-smoke.sh
          sh -n container/test/devtools-smoke.sh

      - name: Download and verify latest signed Supported Release
        id: signed-release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_ROOT_PUBLIC_KEY: ${{ secrets.DSH_RECOVERY_ROOT_PUBLIC_KEY }}
        run: |
          test -n "$RECOVERY_ROOT_PUBLIC_KEY"
          image_input=container/platform/image-input
          release_dir="$image_input/release"
          mkdir -p "$release_dir"
          tag="$(gh release view --json tagName --jq .tagName)"
          gh release download "$tag" --dir "$release_dir"
          printf '%s\n' "$RECOVERY_ROOT_PUBLIC_KEY" > "$image_input/recovery-root.spki.base64"
          cp release/supported-target.json "$image_input/supported-target.json"
          cp container/environment/definition.json "$image_input/environment-definition.json"
          version="$(jq -er '.latestSupportedDsh' release/supported-target.json)"
          npm_input="$RUNNER_TEMP/image-npm-input"
          mkdir -p "$npm_input"
          npm pack "@deepseek-ai/dsh@${version}" --pack-destination "$npm_input" >/dev/null
          tarball="$(find "$npm_input" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          cp "$tarball" "$image_input/dsh.tgz"
          verified="$(node container/platform/tools/verify-image-release.mjs \
            "$release_dir" \
            "$image_input/recovery-root.spki.base64" \
            "$image_input/dsh.tgz" \
            "$image_input/supported-target.json" \
            "$image_input/environment-definition.json")"
          test "$(jq -er .dshVersion <<<"$verified")" = "$version"
          test "$tag" = "platform-$(jq -er .targetSequence <<<"$verified")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'sequence=%s\n' "$(jq -er .targetSequence <<<"$verified")" >> "$GITHUB_OUTPUT"
          cp "$image_input/recovery-root.spki.base64" container/platform/seed/trust/recovery-root.spki.base64
          cp "$release_dir/keyring.json" container/platform/seed/trust/keyring.json
          cp "$release_dir/keyring.sig.json" container/platform/seed/trust/keyring.sig.json
          rm container/platform/seed/trust/DEVELOPMENT_FIXTURE
          test ! -e container/platform/seed/trust/DEVELOPMENT_FIXTURE
          printf 'Building signed Supported DSH %s (sequence %s).\n' \
            "$version" "$(jq -er .targetSequence <<<"$verified")" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.signed-release.outputs.version }}
            PLATFORM_REVISION=${{ github.sha }}
          tags: dsh-gateway-smoke:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke checks
        run: container/test/container-smoke.sh "dsh-gateway-smoke:${{ github.run_id }}"

      - name: Build devtools smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.signed-release.outputs.version }}
            PLATFORM_REVISION=${{ github.sha }}
            INSTALL_DEVTOOLS=true
          tags: dsh-gateway-devtools-smoke:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run devtools smoke checks
        run: container/test/devtools-smoke.sh "dsh-gateway-devtools-smoke:${{ github.run_id }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ env.IMAGE_NAME }} devtools ${{ steps.signed-release.outputs.version }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.signed-release.outputs.version }}
            PLATFORM_REVISION=${{ github.sha }}
            INSTALL_DEVTOOLS=true
          tags: ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.signed-release.outputs.version }}-devtools
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ${{ env.IMAGE_NAME }} ${{ steps.signed-release.outputs.version }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.signed-release.outputs.version }}
            PLATFORM_REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.signed-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish latest-devtools tag
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_OWNER}/${IMAGE_NAME}:latest-devtools" \
            "${IMAGE_OWNER}/${IMAGE_NAME}:${{ steps.signed-release.outputs.version }}-devtools"

      - name: Publish latest tag
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_OWNER}/${IMAGE_NAME}:latest" \
            "${IMAGE_OWNER}/${IMAGE_NAME}:${{ steps.signed-release.outputs.version }}"
