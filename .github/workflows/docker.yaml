name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: DeepSeek Harness npm version (supported reads the reviewed target)
        required: true
        default: supported
        type: string

env:
  IMAGE_OWNER: szcq
  IMAGE_NAME: deepseek-harness

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-image
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify gateway and Compose configuration
        run: |
          npm test --prefix container/control-plane/gateway
          npm test --prefix container/platform
          node container/test/compose-config.mjs
          sh -n container/test/container-smoke.sh
          sh -n container/test/devtools-smoke.sh

      - name: Install production public trust seed
        env:
          RECOVERY_ROOT_PUBLIC_KEY: ${{ secrets.DSH_RECOVERY_ROOT_PUBLIC_KEY }}
          KEYRING_JSON_BASE64: ${{ secrets.DSH_KEYRING_JSON_BASE64 }}
          KEYRING_SIGNATURE_BASE64: ${{ secrets.DSH_KEYRING_SIGNATURE_BASE64 }}
        run: |
          test -n "$RECOVERY_ROOT_PUBLIC_KEY"
          test -n "$KEYRING_JSON_BASE64"
          test -n "$KEYRING_SIGNATURE_BASE64"
          printf '%s\n' "$RECOVERY_ROOT_PUBLIC_KEY" > container/platform/seed/trust/recovery-root.spki.base64
          printf '%s' "$KEYRING_JSON_BASE64" | base64 --decode > container/platform/seed/trust/keyring.json
          printf '%s' "$KEYRING_SIGNATURE_BASE64" | base64 --decode > container/platform/seed/trust/keyring.sig.json
          rm container/platform/seed/trust/DEVELOPMENT_FIXTURE
          test ! -e container/platform/seed/trust/DEVELOPMENT_FIXTURE

      - name: Verify production trust seed
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { verifyRecoveryKeyring } from './container/platform/stage0/lib/keyring.mjs'
          const root = 'container/platform/seed/trust'
          const key = (await readFile(`${root}/recovery-root.spki.base64`, 'utf8')).trim()
          const ring = await readFile(`${root}/keyring.json`)
          const signature = JSON.parse(await readFile(`${root}/keyring.sig.json`, 'utf8'))
          verifyRecoveryKeyring(ring, signature, key)
          NODE

      - name: Resolve DeepSeek Harness version
        id: dsh-version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          requested="${REQUESTED_VERSION:-supported}"
          if [ "$requested" = supported ]; then
            version="$(jq -er '.latestSupportedDsh' release/supported-target.json)"
            node container/platform/tools/supported-target.mjs validate \
              release/supported-target.json container/environment/definition.json >/dev/null
          else
            version="$(npm view "@deepseek-ai/dsh@${requested}" version)"
          fi

          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Unable to resolve '$requested' to one valid image tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building @deepseek-ai/dsh $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.dsh-version.outputs.version }}
          tags: dsh-gateway-smoke:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke checks
        run: container/test/container-smoke.sh "dsh-gateway-smoke:${{ github.run_id }}"

      - name: Build devtools smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.dsh-version.outputs.version }}
            INSTALL_DEVTOOLS=true
          tags: dsh-gateway-devtools-smoke:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run devtools smoke checks
        run: container/test/devtools-smoke.sh "dsh-gateway-devtools-smoke:${{ github.run_id }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ env.IMAGE_NAME }} devtools ${{ steps.dsh-version.outputs.version }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.dsh-version.outputs.version }}
            INSTALL_DEVTOOLS=true
          tags: ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.dsh-version.outputs.version }}-devtools
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ${{ env.IMAGE_NAME }} ${{ steps.dsh-version.outputs.version }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            DSH_VERSION=${{ steps.dsh-version.outputs.version }}
          tags: ${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ steps.dsh-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish latest-devtools tag
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_OWNER}/${IMAGE_NAME}:latest-devtools" \
            "${IMAGE_OWNER}/${IMAGE_NAME}:${{ steps.dsh-version.outputs.version }}-devtools"

      - name: Publish latest tag
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_OWNER}/${IMAGE_NAME}:latest" \
            "${IMAGE_OWNER}/${IMAGE_NAME}:${{ steps.dsh-version.outputs.version }}"
