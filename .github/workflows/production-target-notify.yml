name: Notify Supported Target Publication

on:
  workflow_run:
    workflows:
      - Publish Supported Platform Target
    types:
      - completed

permissions:
  contents: read

jobs:
  notify-published:
    name: Notify signed target publication
    if: github.event.workflow_run.conclusion == 'success'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@c4c7fe9e17854cd4962913ac2792513eab0be988
    with:
      title: DSH 正式目标已发布
      message: >-
        签名目标和必要的 Environment Release 已发布。独立镜像工作流已经启动；如果 production-image 启用了审批，镜像发布会等待批准。
        镜像工作流：${{ github.server_url }}/${{ github.repository }}/actions/workflows/docker.yaml
      priority: 7
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}
