name: DSH Upstream Update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: dsh-upstream-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANDIDATE_BRANCH: automation/dsh-upstream-candidate
  DSH_PACKAGE: "@deepseek-ai/dsh"
  SUPPORTED_TARGET: release/supported-target.json
  ENVIRONMENT_DEFINITION: container/environment/definition.json

jobs:
  discover:
    name: Discover and propose upstream DSH
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      current: ${{ steps.candidate.outputs.current }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      environment: ${{ steps.candidate.outputs.environment }}
      pull_request_url: ${{ steps.propose.outputs.pull_request_url }}
      pull_request_number: ${{ steps.propose.outputs.pull_request_number }}
      head_sha: ${{ steps.propose.outputs.head_sha }}

    steps:
      - name: Checkout protected branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve latest official DSH
        id: upstream
        run: |
          npm view "${DSH_PACKAGE}@latest" version --json > "$RUNNER_TEMP/dsh-version.json"
          version="$(jq -er 'if type == "string" then . else error("expected one version") end' "$RUNNER_TEMP/dsh-version.json")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Advance candidate Supported Target
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          current="$(jq -er '.latestSupportedDsh' "$SUPPORTED_TARGET")"
          trusted_platform="$RUNNER_TEMP/trusted-platform"
          mkdir -p "$trusted_platform/tools"
          cp -R container/platform/lib "$trusted_platform/lib"
          cp container/platform/tools/supported-target.mjs "$trusted_platform/tools/supported-target.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_number="$(gh pr list --state open --head "$CANDIDATE_BRANCH" --json number --jq '.[0].number // empty')"
          replace_closed=false
          if [ -n "$pr_number" ]; then
            git fetch origin "$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
            git switch --create "$CANDIDATE_BRANCH" --track "origin/$CANDIDATE_BRANCH"
            git merge --no-edit "$base_sha"
          else
            if git ls-remote --exit-code --heads origin "$CANDIDATE_BRANCH" >/dev/null 2>&1; then
              git fetch origin "$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
              replace_closed=true
            fi
            git switch --create "$CANDIDATE_BRANCH" "$base_sha"
          fi
          result="$(node "$trusted_platform/tools/supported-target.mjs" advance \
            "$SUPPORTED_TARGET" "$ENVIRONMENT_DEFINITION" "$UPSTREAM_VERSION")"
          changed="$(jq -er '.changed' <<<"$result")"
          environment="$(jq -er '.target.environment' <<<"$result")"
          {
            printf 'changed=%s\n' "$changed"
            printf 'current=%s\n' "$current"
            printf 'upstream=%s\n' "$UPSTREAM_VERSION"
            printf 'environment=%s\n' "$environment"
            printf 'replace_closed=%s\n' "$replace_closed"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          {
            printf '### DSH upstream discovery\n\n'
            printf -- '- Latest Supported: `%s`\n' "$current"
            printf -- '- Latest Official: `%s`\n' "$UPSTREAM_VERSION"
            printf -- '- Environment: `%s`\n' "$environment"
            printf -- '- Candidate required: `%s`\n' "$changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update candidate pull request
        id: propose
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.candidate.outputs.current }}
          UPSTREAM_VERSION: ${{ steps.candidate.outputs.upstream }}
          ENVIRONMENT_VERSION: ${{ steps.candidate.outputs.environment }}
        run: |
          git add -- "$SUPPORTED_TARGET"
          git commit -m "chore(dsh): validate ${UPSTREAM_VERSION}"

          if [ "${{ steps.candidate.outputs.replace_closed }}" = true ]; then
            git push --force-with-lease origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          fi

          body="$RUNNER_TEMP/dsh-candidate-pr.md"
          # shellcheck disable=SC2016
          {
            printf '## DSH candidate validation\n\n'
            printf '| State | Version |\n|---|---|\n'
            printf '| Latest Supported | `%s` |\n' "$CURRENT_VERSION"
            printf '| Latest Official candidate | `%s` |\n' "$UPSTREAM_VERSION"
            printf '| Current Environment | `%s` |\n\n' "$ENVIRONMENT_VERSION"
            printf 'This PR changes only the candidate Supported Target. Compatibility CI validates the new DSH with the current Environment. Merge remains the production publication gate.\n'
          } > "$body"

          pr_number="$(gh pr list --state open --head "$CANDIDATE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$CANDIDATE_BRANCH" \
              --title "chore(dsh): validate ${UPSTREAM_VERSION}" \
              --body-file "$body")"
            pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          else
            gh pr edit "$pr_number" \
              --title "chore(dsh): validate ${UPSTREAM_VERSION}" \
              --body-file "$body"
            pr_url="$(gh pr view "$pr_number" --json url --jq .url)"
          fi
          {
            printf 'pull_request_url=%s\n' "$pr_url"
            printf 'pull_request_number=%s\n' "$pr_number"
            printf 'head_sha=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          printf 'Candidate PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

  validate-candidate:
    name: Validate candidate Runtime
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/dsh-candidate-validation.yml
    with:
      ref: ${{ needs.discover.outputs.head_sha }}

  report-validation:
    name: Report candidate validation
    needs: [discover, validate-candidate]
    if: always() && needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Publish commit status and PR report
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.discover.outputs.head_sha }}
          PR_NUMBER: ${{ needs.discover.outputs.pull_request_number }}
          VALIDATION_RESULT: ${{ needs.validate-candidate.result }}
          UPSTREAM_VERSION: ${{ needs.discover.outputs.upstream }}
          ENVIRONMENT_VERSION: ${{ needs.discover.outputs.environment }}
        run: |
          if [ "$VALIDATION_RESULT" = success ]; then
            state=success
            label=passed
            description="Candidate Runtime validation passed"
          else
            state=failure
            label=failed
            description="Candidate Runtime validation failed"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='DSH candidate Runtime' \
            -f description="$description" \
            -f target_url="$run_url" >/dev/null
          gh pr comment "$PR_NUMBER" --body "DSH \`${UPSTREAM_VERSION}\` with Environment \`${ENVIRONMENT_VERSION}\` **${label}** compatibility validation. [Open workflow run](${run_url})."
          printf 'Candidate validation %s: %s\n' "$label" "$run_url" >> "$GITHUB_STEP_SUMMARY"

  notify-discovered:
    name: Notify upstream discovery
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@v1
    with:
      title: 发现 DSH 上游新版本 ${{ needs.discover.outputs.upstream }}
      message: >-
        当前支持版本：${{ needs.discover.outputs.current }}；上游候选版本：${{ needs.discover.outputs.upstream }}。
        候选 Environment：${{ needs.discover.outputs.environment }}。
        候选 PR：${{ needs.discover.outputs.pull_request_url }}
      priority: 6
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}

  notify-validation-passed:
    name: Notify candidate success
    needs: [discover, validate-candidate]
    if: always() && needs.discover.outputs.changed == 'true' && needs.validate-candidate.result == 'success'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@v1
    with:
      title: DSH ${{ needs.discover.outputs.upstream }} 候选版本验证通过
      message: >-
        DSH ${{ needs.discover.outputs.upstream }} 已通过 Environment
        ${{ needs.discover.outputs.environment }} 兼容性验证。请审核并合并：
        ${{ needs.discover.outputs.pull_request_url }}
      priority: 7
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}

  notify-validation-failed:
    name: Notify candidate failure
    needs: [discover, validate-candidate]
    if: always() && needs.discover.outputs.changed == 'true' && needs.validate-candidate.result != 'success'
    uses: yjrszcq/github-workflows/.github/workflows/gotify-notify.yml@v1
    with:
      title: DSH ${{ needs.discover.outputs.upstream }} 候选版本验证失败
      message: >-
        DSH ${{ needs.discover.outputs.upstream }} 未通过 Environment
        ${{ needs.discover.outputs.environment }} 兼容性验证，需要适配 Environment。
        工作流：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      priority: 8
    secrets:
      gotify_url: ${{ secrets.GOTIFY_URL }}
      gotify_token: ${{ secrets.GOTIFY_TOKEN }}
